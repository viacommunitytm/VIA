<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(45, 55, 80, 0.18), transparent 35%),
        linear-gradient(180deg, #05070b 0%, #080b12 55%, #030408 100%);
    color: #e8ebf2;
    font-family: Arial, Helvetica, sans-serif;
}

/* Ночное небо */
.sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

/* Очень слабые звёзды */
.star {
    position: absolute;
    width: 1px;
    height: 1px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    animation: twinkle 4s infinite ease-in-out;
}

.star:nth-child(1) { left: 12%; top: 18%; animation-delay: 1s; }
.star:nth-child(2) { left: 23%; top: 31%; animation-delay: 2s; }
.star:nth-child(3) { left: 34%; top: 12%; animation-delay: .5s; }
.star:nth-child(4) { left: 67%; top: 19%; animation-delay: 1.7s; }
.star:nth-child(5) { left: 78%; top: 34%; animation-delay: 2.5s; }
.star:nth-child(6) { left: 88%; top: 14%; animation-delay: .8s; }
.star:nth-child(7) { left: 58%; top: 10%; animation-delay: 3s; }
.star:nth-child(8) { left: 43%; top: 27%; animation-delay: 1.3s; }

@keyframes twinkle {
    0%, 100% { opacity: .15; }
    50% { opacity: .65; }
}

/* Дождь */
.rain {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.drop {
    position: absolute;
    top: -40px;
    width: 1px;
    height: 22px;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(180, 200, 225, 0.35)
    );
    animation: rain linear infinite;
}

/* Дождь преимущественно по краям */
.drop:nth-child(1) { left: 3%; animation-duration: 1.2s; animation-delay: .2s; }
.drop:nth-child(2) { left: 6%; animation-duration: 1.6s; animation-delay: .8s; }
.drop:nth-child(3) { left: 9%; animation-duration: 1.3s; animation-delay: .4s; }
.drop:nth-child(4) { left: 13%; animation-duration: 1.8s; animation-delay: 1s; }
.drop:nth-child(5) { left: 17%; animation-duration: 1.5s; animation-delay: .3s; }
.drop:nth-child(6) { left: 22%; animation-duration: 1.9s; animation-delay: 1.4s; }

.drop:nth-child(7) { right: 3%; left: auto; animation-duration: 1.4s; }
.drop:nth-child(8) { right: 7%; left: auto; animation-duration: 1.7s; animation-delay: .5s; }
.drop:nth-child(9) { right: 11%; left: auto; animation-duration: 1.3s; animation-delay: 1s; }
.drop:nth-child(10) { right: 15%; left: auto; animation-duration: 1.8s; animation-delay: .2s; }
.drop:nth-child(11) { right: 20%; left: auto; animation-duration: 1.5s; animation-delay: 1.2s; }
.drop:nth-child(12) { right: 24%; left: auto; animation-duration: 1.9s; animation-delay: .7s; }

@keyframes rain {
    to {
        transform: translateY(110vh);
    }
}

/* Навигация */
.nav {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(10, 13, 20, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 14px;
    z-index: 10;
}

.nav a {
    color: rgba(235,238,245,.65);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: .08em;
    padding: 10px 15px;
    border-radius: 9px;
    transition: .25s ease;
}

.nav a:hover {
    color: white;
    background: rgba(255,255,255,.07);
}

/* Главный экран */
.hero {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 2;
}

.center {
    transform: translateY(-2vh);
}

.label {
    font-size: 10px;
    letter-spacing: .35em;
    color: rgba(210,218,235,.38);
    margin-bottom: 24px;
    text-transform: uppercase;
}

.logo {
    font-size: clamp(90px, 15vw, 230px);
    font-weight: 500;
    letter-spacing: .16em;
    margin-right: -.16em;
    color: rgba(239,242,248,.92);

    text-shadow:
        0 0 35px rgba(160,180,220,.08);

    animation: appear 1.6s cubic-bezier(.16,1,.3,1) forwards;
}

.subtitle {
    margin-top: 18px;
    color: rgba(220,225,236,.42);
    font-size: 12px;
    letter-spacing: .28em;
    text-transform: uppercase;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
        letter-spacing: .3em;
    }
    to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: .16em;
    }
}

/* Нижняя информация */
.bottom {
    position: fixed;
    bottom: 28px;
    left: 32px;
    right: 32px;
    display: flex;
    justify-content: space-between;
    color: rgba(220,225,235,.32);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    z-index: 5;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(190,210,235,.55);
    box-shadow: 0 0 8px rgba(190,210,235,.4);
}

/* Затемнение краёв */
.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.3) 75%,
        rgba(0,0,0,.65) 100%
    );
}

/* Телефон */
@media (max-width: 600px) {

    .nav {
        top: 18px;
        max-width: calc(100% - 30px);
        overflow-x: auto;
    }

    .nav a {
        white-space: nowrap;
        padding: 9px 11px;
        font-size: 10px;
    }

    .logo {
        font-size: 26vw;
    }

    .subtitle {
        font-size: 9px;
        letter-spacing: .18em;
    }

    .bottom {
        left: 18px;
        right: 18px;
        bottom: 18px;
    }
}
</style>
</head>

<body>

<div class="sky">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>

<div class="rain">
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>

    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
    <div class="drop"></div>
</div>

<nav class="nav">
    <a href="#">ГЛАВНАЯ</a>
    <a href="#">ПРАВИЛА</a>
    <a href="#">ПРОЕКТ</a>
    <a href="#">КОМАНДА</a>
</nav>

<main class="hero">

    <div class="center">
        <div class="label">VIA COMMUNITY</div>

        <div class="logo">VIA</div>

        <div class="subtitle">
            Всё начинается здесь
        </div>
    </div>

</main>

<div class="bottom">
    <div class="status">
        <span class="status-dot"></span>
        ONLINE
    </div>

    <div>VIA © 2026</div>
</div>

<div class="vignette"></div>

</body>
</html>
